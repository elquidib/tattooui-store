<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TATTO✦OUI Staff Accounts</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#171717;font:14px system-ui}.wrap{max-width:800px;margin:auto;padding:20px}.card{background:white;border:1px solid #ddd;border-radius:15px;padding:18px;margin:12px 0}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px}label{display:block;font-weight:700;margin:10px 0 5px}button{padding:11px 14px;border:0;border-radius:9px;background:#111;color:white;font-weight:700;cursor:pointer}.secondary{background:#eee;color:#111}.danger{background:#b42318}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #eee;padding:13px 0}.muted{color:#777}.hidden{display:none!important}.error{color:#b42318}.success{color:#147849}@media(max-width:600px){.row{grid-template-columns:1fr}.person{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="wrap"><h1>TATTO✦OUI · Staff accounts</h1><p class="muted">Create usernames, set 6-digit PINs, and deactivate staff access.</p><p><a href="./index.html">← Back to admin</a></p>
<section id="denied" class="card hidden">Admin access required. <a href="./index.html">Sign in to the main admin</a>, then reopen this page.</section>
<div id="app" class="hidden"><section class="card"><h2 id="title">Create staff account</h2><form id="form"><input id="id" type="hidden"><div class="row"><div><label>Display name</label><input id="display" required></div><div><label>Username</label><input id="username" pattern="[A-Za-z0-9._-]{3,32}" required></div></div><label>Six-digit PIN (leave blank to keep existing PIN when editing)</label><input id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="new-password"><p class="muted">PIN is stored as a salted PBKDF2 hash.</p><button id="save">Save account</button> <button type="button" id="clear" class="secondary">Clear</button><p id="msg"></p></form></section><section class="card"><h2>Staff members</h2><button id="refresh" class="secondary">Refresh</button><div id="list">Loading…</div></section></div></main>
<script>
(()=>{const c=window.TATTOOUI_SUPABASE;if(!c||!window.supabase)return;const sb=window.supabase.createClient(c.url,c.publishableKey),url=c.url+'/functions/v1/staff-portal',$=x=>document.getElementById(x);let jwt='';
const safe=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function api(action,data={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':c.publishableKey,Authorization:'Bearer '+jwt},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function auth(){const s=await sb.auth.getSession();if(!s.data.session){$('denied').classList.remove('hidden');return}jwt=s.data.session.access_token;try{await api('admin_list');$('app').classList.remove('hidden');await load()}catch(e){$('denied').classList.remove('hidden')}}
async function load(){const d=await api('admin_list');$('list').innerHTML=(d.staff||[]).map(s=>'<div class="person"><div><b>'+safe(s.display_name)+'</b> · @'+safe(s.username)+'<br><small class="muted">'+(s.active?'Active':'Deactivated')+(s.locked_until?' · Locked until '+safe(s.locked_until):'')+'</small></div><div><button class="secondary" data-edit="'+s.id+'">Edit / reset PIN</button> <button class="'+(s.active?'danger':'secondary')+'" data-active="'+s.id+'" data-value="'+s.active+'">'+(s.active?'Deactivate':'Activate')+'</button></div></div>').join('')||'No staff accounts.'}
function clear(){$('form').reset();$('id').value='';$('title').textContent='Create staff account'}
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await api('admin_save',{id:$('id').value||undefined,display_name:$('display').value.trim(),username:$('username').value.trim().toLowerCase(),pin:$('pin').value||undefined,active:true});$('msg').className='success';$('msg').textContent='Saved. Share the PIN securely.';clear();await load()}catch(e){$('msg').className='error';$('msg').textContent=e.message}finally{$('save').disabled=false}};
$('list').onclick=async e=>{const ed=e.target.closest('[data-edit]'),ac=e.target.closest('[data-active]');try{if(ed){const s=(await api('admin_list')).staff.find(x=>x.id===ed.dataset.edit);$('id').value=s.id;$('display').value=s.display_name;$('username').value=s.username;$('pin').value='';$('title').textContent='Edit / reset PIN'}if(ac){const s=(await api('admin_list')).staff.find(x=>x.id===ac.dataset.active);await api('admin_save',{id:s.id,display_name:s.display_name,username:s.username,active:ac.dataset.value!=='true'});await load()}}catch(e){alert(e.message)}};
$('clear').onclick=clear;$('refresh').onclick=load;auth()})();
</script></body></html>
