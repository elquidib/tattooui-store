function openCart(){renderCart();document.getElementById("cartDrawer").classList.add("open");document.getElementById("cartDrawer").setAttribute("aria-hidden","false")}
function closeCart(){document.getElementById("cartDrawer").classList.remove("open");document.getElementById("cartDrawer").setAttribute("aria-hidden","true")}
function renderCart(){const box=document.getElementById("cartItems");if(!box)return;const savedScroll=box.scrollTop;if(!cart.length){box.innerHTML='<div class="empty">Your bag is empty.<br><br><button class="btn" onclick="closeCart();home()">Explore tattoos</button></div>';document.getElementById("cartSubtotal").textContent="0 DH";return}let total=0;box.innerHTML=cart.map(r=>{const p=products.find(x=>x.id===r.id);total+=p.price*r.qty;return `<div class="cart-item"><img src="${p.images[0]?.src||NO_IMAGE}" alt="${esc(p.name)}"><div><h4>${esc(p.name)}</h4><p>${money(p.price)} each</p><div class="mini-qty"><button type="button" class="mini-qty-btn" aria-label="Decrease quantity" onclick="event.stopPropagation();updateCartQty(${p.id},-1)">−</button><span class="mini-qty-count">${r.qty} pcs</span><button type="button" class="mini-qty-btn" aria-label="Increase quantity" onclick="event.stopPropagation();updateCartQty(${p.id},1)">+</button><button type="button" class="remove" onclick="event.stopPropagation();removeFromCart(${p.id})">Remove</button></div></div><b>${money(p.price*r.qty)}</b></div>`}).join("");document.getElementById("cartSubtotal").textContent=money(total);box.scrollTop=savedScroll}
function buyNow(id){const p=products.find(x=>x.id===id);if(!p)return false;const stock=Number(p.stock);if(Number.isFinite(stock)&&stock<=0){toast("This product is currently out of stock");return false}const qty=getProductQty();if(Number.isFinite(stock)&&qty>stock){toast("Only "+stock+" available");return false}const row=cart.find(x=>x.id===id);if(row)row.qty=qty;else cart.push({id,qty});saveCart();toast(qty+" "+(qty===1?"item":"items")+" ready to order");goCheckout();return true}
function goCheckout(){if(!cart.length){toast("Your bag is empty");return}closeCart();location.hash="/checkout";render();window.scrollTo({top:0,behavior:"instant"})}
function checkoutView(){
let subtotal=cart.reduce((s,r)=>{const p=products.find(x=>x.id===r.id);return s+(p?p.price*r.qty:0)},0);let total=subtotal+shippingFee;
return `<div class="view active">${header()}<main class="checkout"><div class="kicker">Secure order</div><h1>Complete your order.</h1><p style="color:#777">Cash on delivery in Morocco. No account needed.</p><form novalidate onsubmit="submitOrder(event)"><div class="form-grid"><div class="field"><label>Full name <span class="required-star">*</span></label><input name="name" data-required="true" autocomplete="name" placeholder="Your name"></div><div class="field"><label>Phone <span class="required-star">*</span></label><input name="phone" data-required="true" inputmode="tel" autocomplete="tel" placeholder="06 XX XX XX XX"></div><div class="field"><label>City <span class="required-star">*</span></label><input name="city" data-required="true" autocomplete="address-level2" placeholder="Agadir"></div><div class="field"><label>Area / quartier <span class="required-star">*</span></label><input name="area" data-required="true" autocomplete="address-line2" placeholder="Hay / quartier"></div><div class="field full"><label>Order note</label><textarea name="note" placeholder="Optional note"></textarea></div></div><div class="order-box"><h3 style="margin-top:0">Your order</h3><p style="font-size:12px;color:#777;margin-top:-4px">Review your items before placing the order. You can remove anything you no longer want.</p><div class="checkout-items">${cart.map(r=>{const p=products.find(x=>x.id===r.id);return `<div class="checkout-item" id="checkout-item-${p.id}"><img class="checkout-item-image" src="${p.images[0].src}" alt="${esc(p.name)}"><div class="checkout-item-info"><div class="checkout-item-name">${esc(p.name)}</div><div class="checkout-item-meta">${money(p.price)} each</div><div class="checkout-qty"><button type="button" aria-label="Decrease quantity" onclick="changeCheckoutQty(${p.id},-1)">−</button><span class="checkout-qty-value" id="checkout-qty-${p.id}">${r.qty} pcs</span><button type="button" aria-label="Increase quantity" onclick="changeCheckoutQty(${p.id},1)">+</button></div></div><div class="checkout-item-price"><b id="checkout-line-${p.id}">${money(p.price*r.qty)}</b><button type="button" class="checkout-remove" aria-label="Remove ${esc(p.name)}" title="Remove product" onclick="removeFromCheckout(${p.id})">×</button></div></div>`}).join("")}</div><div class="order-line"><span>Subtotal</span><span id="checkout-subtotal">${money(subtotal)}</span></div><div class="order-line"><span>Delivery</span><span id="checkout-shipping">${money(shippingFee)}</span></div><div class="order-line" style="font-size:18px"><span>Total</span><span class="checkout-total">${money(total)}</span></div></div><button class="btn wide" type="submit">Place COD order</button><div id="turnstileWidget" style="display:flex;justify-content:center;min-height:65px;margin:14px 0"></div><p style="font-size:11px;color:#888;text-align:center">Your order will be prepared for confirmation.</p></form></main>${footer()}</div>`;
}
function checkoutTotal(){return cart.reduce((sum,item)=>{const p=products.find(x=>x.id===item.id);return sum+(p?p.price*item.qty:0)},0)+shippingFee}
function updateCheckoutTotal(){const subtotal=checkoutTotal()-shippingFee;document.querySelectorAll("#checkout-subtotal").forEach(el=>el.textContent=money(subtotal));document.querySelectorAll("#checkout-shipping").forEach(el=>el.textContent=money(shippingFee));document.querySelectorAll(".checkout-total").forEach(el=>el.textContent=money(subtotal+shippingFee))}
function changeCheckoutQty(id,d){const r=cart.find(x=>x.id===id);if(!r)return;r.qty+=d;if(r.qty<1){removeFromCheckout(id);return}localStorage.setItem("tattooui-cart",JSON.stringify(cart));updateBadge();const qtyEl=document.getElementById("checkout-qty-"+id);const lineEl=document.getElementById("checkout-line-"+id);const p=products.find(x=>x.id===id);if(qtyEl)qtyEl.textContent=r.qty+" pcs";if(lineEl&&p)lineEl.textContent=money(p.price*r.qty);updateCheckoutTotal();toast("Quantity updated")}
function removeFromCheckout(id){cart=cart.filter(x=>x.id!==id);localStorage.setItem("tattooui-cart",JSON.stringify(cart));updateBadge();const row=document.getElementById("checkout-item-"+id);if(row)row.remove();if(!cart.length){location.hash="/";render();window.scrollTo({top:0,behavior:"instant"});return}updateCheckoutTotal();toast("Item removed from your order")}
async function submitOrder(e){e.preventDefault();const form=e.target;const requiredFields=[...form.querySelectorAll('[data-required="true"]')];requiredFields.forEach(el=>{el.classList.remove('checkout-field-error');const label=el.closest('.field')?.querySelector('label');if(label)label.classList.remove('field-error-label')});const missing=requiredFields.find(el=>!String(el.value||'').trim());if(missing){const field=missing.closest('.field');missing.classList.add('checkout-field-error');const label=field?.querySelector('label');if(label)label.classList.add('field-error-label');missing.focus();return}const data=new FormData(form),btn=form.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Placing order…';try{if(!cart.length)throw new Error('Your cart is empty.');const name=String(data.get('name')||'').trim(),phone=String(data.get('phone')||'').trim(),city=String(data.get('city')||'').trim(),area=String(data.get('area')||'').trim(),note=String(data.get('note')||'').trim();const items=cart.map(r=>{const p=products.find(x=>x.id===r.id);if(!p||!p.dbId)throw new Error('A product in your cart is no longer available.');return{product_id:p.dbId,quantity:Number(r.qty)}});const checkoutKey=sessionStorage.getItem('tattooui-checkout-key')||((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():('tattooui-'+Date.now()+'-'+Math.random().toString(36).slice(2)));sessionStorage.setItem('tattooui-checkout-key',checkoutKey);if(!TURNSTILE_SITE_KEY)throw new Error('Checkout security is not configured yet.');renderTurnstile();if(!turnstileToken)throw new Error('Please complete the security check.');const orderRes=await fetch('https://ahvmgdzjfyuhgtgpuavo.supabase.co/functions/v1/place-cod-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({turnstile_token:turnstileToken,order:{p_customer_name:name,p_phone:phone,p_city:city,p_address:area,p_notes:note||null,p_items:items,p_idempotency_key:checkoutKey}})}).then(async response=>{const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'Could not place your order.');return{data:payload.data,error:null}});if(orderRes.error)throw orderRes.error;const result=Array.isArray(orderRes.data)?orderRes.data[0]:orderRes.data;if(!result||!result.order_number)throw new Error('Order could not be confirmed.');const placedItems=cart.map(r=>{const p=products.find(x=>x.id===r.id);return{name:p?.name||'Product',qty:r.qty,total:(p?.price||0)*r.qty}});localStorage.setItem('tattooui-last-order',JSON.stringify({name,total:Number(result.total),shipping:Number(result.shipping),subtotal:Number(result.subtotal),items:placedItems}));sessionStorage.removeItem('tattooui-checkout-key');localStorage.removeItem('tattooui-cart');cart=[];location.hash='/order-confirmed/'+result.order_number;render();window.scrollTo({top:0,behavior:'instant'})}catch(err){console.error(err);toast(err.message||'Could not place your order.');btn.disabled=false;btn.textContent='Place COD order'}}function confirmationView(orderNumber){const info=JSON.parse(localStorage.getItem("tattooui-last-order")||"{}");const items=Array.isArray(info.items)?info.items:[];return '<div class="view active">'+header()+'<main class="checkout" style="text-align:center"><div style="font-size:58px;line-height:1;margin-bottom:18px">✓</div><div class="kicker">Order confirmed</div><h1>Thank you for your trust.</h1><p style="color:#777;max-width:590px;margin:0 auto 28px;font-size:15px;line-height:1.7">Your order has been received successfully. We will contact you to confirm the details before shipping.</p><div class="order-box" style="max-width:560px;margin:25px auto;text-align:left"><div class="order-line"><span>Order number</span><b>#'+esc(orderNumber)+'</b></div>'+(info.name?'<div class="order-line"><span>Customer</span><span>'+esc(info.name)+'</span></div>':'')+(items.length?'<div style="padding:12px 0 4px;font-weight:800">Your order</div>'+items.map(i=>'<div class="order-line"><span>'+esc(i.name)+' × '+i.qty+'</span><span>'+money(i.total)+'</span></div>').join(''):'')+(info.subtotal!=null?'<div class="order-line"><span>Subtotal</span><span>'+money(info.subtotal)+'</span></div>':'')+(info.shipping!=null?'<div class="order-line"><span>Delivery</span><span>'+money(info.shipping)+'</span></div>':'')+'<div class="order-line"><span>Total</span><b>'+money(Number(info.total||0))+'</b></div><div class="order-line"><span>Payment</span><span>Cash on delivery</span></div></div><div style="background:#eeece6;border-radius:14px;padding:17px 20px;max-width:560px;margin:0 auto 25px;color:#555;font-size:13px;line-height:1.6">We’ll contact you to confirm your order, then prepare it for delivery.</div><a class="btn" href="#/" onclick="home();return false">Continue shopping</a></main>'+footer()+'</div>'}
function openModal(src){document.getElementById("modalImg").src=src;document.getElementById("imageModal").classList.add("open")}
function closeModal(){document.getElementById("imageModal").classList.remove("open")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove("show"),2200)}
function render(){const path=location.hash.replace(/^#/,"")||"/";let app=document.getElementById("app");if(path.startsWith("/product/")){const p=products.find(x=>x.id===Number(path.split("/")[2]));app.innerHTML=p?productView(p):homeView()}else if(path==="/checkout"){app.innerHTML=checkoutView()}else if(path.startsWith("/order-confirmed/")){app.innerHTML=confirmationView(path.split("/")[2]||"")}else app.innerHTML=homeView();updateBadge();renderCart()}
window.addEventListener("hashchange",()=>{resetTurnstile();render();setTimeout(renderTurnstile,150)});window.addEventListener("scroll",()=>document.getElementById("backtop").classList.toggle("show",scrollY>600));render();syncStorefrontProductImages();setTimeout(renderTurnstile,500);
</script>
