function removeFromCheckout(id){cart=cart.filter(x=>x.id!==id);localStorage.setItem("tattooui-cart",JSON.stringify(cart));updateBadge();const row=document.getElementById("checkout-item-"+id);if(row)row.remove();if(!cart.length){location.hash="/";render();window.scrollTo({top:0,behavior:"instant"});return}updateCheckoutTotal();toast("Item removed from your order")}
async function submitOrder(e){e.preventDefault();const form=e.target;const requiredFields=[...form.querySelectorAll('[data-required="true"]')];requiredFields.forEach(el=>{el.classList.remove('checkout-field-error');const label=el.closest('.field')?.querySelector('label');if(label)label.classList.remove('field-error-label')});const missing=requiredFields.find(el=>!String(el.value||'').trim());if(missing){const field=missing.closest('.field');missing.classList.add('checkout-field-error');const label=field?.querySelector('label');if(label)label.classList.add('field-error-label');missing.focus();return}const data=new FormData(form),btn=form.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Placing order…';try{if(!cart.length)throw new Error('Your cart is empty.');const name=String(data.get('name')||'').trim(),phone=String(data.get('phone')||'').trim(),city=String(data.get('city')||'').trim(),area=String(data.get('area')||'').trim(),note=String(data.get('note')||'').trim();const items=cart.map(r=>{const p=products.find(x=>x.id===r.id);if(!p||!p.dbId)throw new Error('A product in your cart is no longer available.');return{product_id:p.dbId,quantity:Number(r.qty)}});const checkoutKey=sessionStorage.getItem('tattooui-checkout-key')||((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():('tattooui-'+Date.now()+'-'+Math.random().toString(36).slice(2)));sessionStorage.setItem('tattooui-checkout-key',checkoutKey);const purchaseEventId=sessionStorage.getItem('tattooui-purchase-event-id')||((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():('purchase-'+Date.now()+'-'+Math.random().toString(36).slice(2)));sessionStorage.setItem('tattooui-purchase-event-id',purchaseEventId);if(!TURNSTILE_SITE_KEY)throw new Error('Checkout security is not configured yet.');renderTurnstile();if(!turnstileToken)throw new Error('Please complete the security check.');const orderRes=await fetch('https://ahvmgdzjfyuhgtgpuavo.supabase.co/functions/v1/place-cod-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({turnstile_token:turnstileToken,purchase_event_id:purchaseEventId,event_source_url:window.location.href,order:{p_customer_name:name,p_phone:phone,p_city:city,p_address:area,p_notes:note||null,p_items:items,p_idempotency_key:checkoutKey}})}).then(async response=>{const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'Could not place your order.');return{data:payload.data,error:null}});if(orderRes.error)throw orderRes.error;const result=Array.isArray(orderRes.data)?orderRes.data[0]:orderRes.data;if(!result||!result.order_number)throw new Error('Order could not be confirmed.');const placedItems=cart.map(r=>{const p=products.find(x=>x.id===r.id);return{name:p?.name||'Product',qty:r.qty,total:(p?.price||0)*r.qty}});localStorage.setItem('tattooui-last-order',JSON.stringify({name,total:Number(result.total),shipping:Number(result.shipping),subtotal:Number(result.subtotal),items:placedItems}));metaTrack("Purchase",{content_ids:items.map(item=>String(item.product_id)),content_type:"product",num_items:items.reduce((sum,item)=>sum+Number(item.quantity||0),0),value:Number(result.total),discount:Number(result.discount_amount||0),currency:"MAD"},{eventID:purchaseEventId});sessionStorage.removeItem('tattooui-checkout-key');sessionStorage.removeItem('tattooui-purchase-event-id');localStorage.removeItem('tattooui-cart');cart=[];location.hash='/order-confirmed/'+result.order_number;render();window.scrollTo({top:0,behavior:'instant'})}catch(err){console.error(err);toast(err.message||'Could not place your order.');btn.disabled=false;btn.textContent='Place COD order'}}function confirmationView(orderNumber){const info=JSON.parse(localStorage.getItem("tattooui-last-order")||"{}");const items=Array.isArray(info.items)?info.items:[];return '<div class="view active">'+header()+'<main class="checkout" style="text-align:center"><div style="font-size:58px;line-height:1;margin-bottom:18px">✓</div><div class="kicker">Order confirmed</div><h1>Thank you for your trust.</h1><p style="color:#777;max-width:590px;margin:0 auto 28px;font-size:15px;line-height:1.7">Your order has been received successfully. We will contact you to confirm the details before shipping.</p><div class="order-box" style="max-width:560px;margin:25px auto;text-align:left"><div class="order-line"><span>Order number</span><b>#'+esc(orderNumber)+'</b></div>'+(info.name?'<div class="order-line"><span>Customer</span><span>'+esc(info.name)+'</span></div>':'')+(items.length?'<div style="padding:12px 0 4px;font-weight:800">Your order</div>'+items.map(i=>'<div class="order-line"><span>'+esc(i.name)+' × '+i.qty+'</span><span>'+money(i.total)+'</span></div>').join(''):'')+(info.subtotal!=null?'<div class="order-line"><span>Subtotal</span><span>'+money(info.subtotal)+'</span></div>':'')+(info.shipping!=null?'<div class="order-line"><span>Delivery</span><span>'+money(info.shipping)+'</span></div>':'')+'<div class="order-line"><span>Total</span><b>'+money(Number(info.total||0))+'</b></div><div class="order-line"><span>Payment</span><span>Cash on delivery</span></div></div><div style="background:#eeece6;border-radius:14px;padding:17px 20px;max-width:560px;margin:0 auto 25px;color:#555;font-size:13px;line-height:1.6">We’ll contact you to confirm your order, then prepare it for delivery.</div><a class="btn" href="#/" onclick="home();return false">Continue shopping</a></main>'+footer()+'</div>'}
function openModal(src){document.getElementById("modalImg").src=src;document.getElementById("imageModal").classList.add("open")}
function closeModal(){document.getElementById("imageModal").classList.remove("open")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove("show"),2200)}
function legalView(type){const title={privacy:"Privacy Policy",terms:"Terms & Conditions",returns:"Returns & Exchanges",shipping:"Shipping Policy",contact:"Contact TATTO✦OUI"}[type]||"TATTO✦OUI";const body={privacy:'<h2>Privacy Policy</h2><p>We collect the information you provide when placing an order, such as your name, phone number, city and delivery address, so we can process and confirm your COD order.</p><h3>How we use your information</h3><p>We use order information to confirm orders, prepare delivery, provide customer support and maintain our store records. You do not need to create an account to place an order.</p><h3>Security</h3><p>Checkout is protected with Cloudflare Turnstile and orders are processed through our secure backend.</p><h3>Your choices</h3><p>For questions about your order information or to request an update, contact us through our official Instagram page.</p>',terms:'<h2>Terms & Conditions</h2><p>By placing an order on TATTO✦OUI, you confirm that the information you provide is accurate and that you understand the order is placed using cash on delivery.</p><h3>Orders</h3><p>Orders are subject to product availability. We may contact you to confirm your name, phone number, address and requested items before dispatch.</p><h3>Prices</h3><p>Prices are shown in Moroccan dirhams. Delivery charges are shown during checkout.</p><h3>Product use</h3><p>Temporary tattoos should be applied only to clean, intact skin and according to the product instructions. Stop use if irritation occurs.</p>',returns:'<h2>Returns & Exchanges</h2><p>If you receive a damaged, incorrect or materially different item, contact TATTO✦OUI as soon as possible with your order number and clear photos.</p><h3>Eligibility</h3><p>For change-of-mind requests, items should be unused and in their original condition. We will review each request and confirm the available return or exchange option before you send anything back.</p><h3>Contact first</h3><p>Please do not send a return without contacting us first. Return instructions depend on the order and delivery situation.</p>',shipping:'<h2>Shipping Policy</h2><p>We deliver across Morocco using cash on delivery. The delivery charge shown at checkout is added to your order total.</p><h3>Delivery timing</h3><p>Delivery timing can vary by city, carrier workload and order confirmation. We confirm the delivery details with you before dispatch.</p><h3>Address accuracy</h3><p>Please provide a complete city and area/address. If the courier cannot reach you because the information is incomplete or the phone number is unreachable, delivery may be delayed.</p>',contact:'<h2>Contact TATTO✦OUI</h2><p>For order confirmation, delivery questions, returns or general support, contact us through Instagram.</p><p><a class="btn" href="${siteSettings.instagram_url||"https://www.instagram.com/tattooui_/"}" target="_blank" rel="noopener">Message us on Instagram</a></p><p style="color:#777">When contacting us about an order, include your order number and the phone number used at checkout.</p>'}[type]||'';return '<div class="view active">'+header()+'<main class="checkout"><div class="kicker">TATTO✦OUI</div><h1>'+title+'</h1><div class="order-box" style="line-height:1.8;color:#555">'+body+'</div><a class="btn ghost" href="#/" onclick="home();return false">Back to store</a></main>'+footer()+'</div>'}
function render(){const path=location.hash.replace(/^#/,"")||"/";let app=document.getElementById("app");if(path.startsWith("/product/")){const p=products.find(x=>x.id===Number(path.split("/")[2]));app.innerHTML=p?productView(p):homeView();if(p&&p.dbId)metaTrack("ViewContent",{content_ids:[String(p.dbId)],content_type:"product",content_name:p.name,value:Number(p.price),currency:"MAD"})}else if(path==="/checkout"){app.innerHTML=checkoutView()}else if(path.startsWith("/order-confirmed/")){app.innerHTML=confirmationView(path.split("/")[2]||"")}else if(["/privacy","/terms","/returns","/shipping","/contact"].includes(path)){app.innerHTML=legalView(path.slice(1))}else app.innerHTML=homeView();updateBadge();renderCart()}
function updateSEO(){
  const path=location.hash.replace(/^#/,"")||"/";
  const base="https://tattooui-store.pages.dev";
  const p=path.startsWith("/product/")?products.find(x=>x.id===Number(path.split("/")[2])):null;
  const title=p?(String(p.name)+" — TATTO✦OUI"):"TATTO✦OUI — Temporary Tattoos";
  const desc=p?String(p.desc||"Temporary tattoo design.").slice(0,155):"Premium temporary tattoos in Morocco. Express your style. Cash on delivery across Morocco.";
  document.title=title;
  const setMeta=(selector,attrs,value)=>{let el=document.querySelector(selector);if(!el){el=document.createElement("meta");Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));document.head.appendChild(el)}el.setAttribute("content",value)};
  setMeta('meta[name="description"]',{name:"description"},desc);
  setMeta('meta[property="og:title"]',{property:"og:title"},title);
  setMeta('meta[property="og:description"]',{property:"og:description"},desc);
  let link=document.querySelector('link[rel="canonical"]');if(!link){link=document.createElement("link");link.rel="canonical";document.head.appendChild(link)}
  link.href=base+(p?"/#/product/"+p.id:"/");
  const schema=document.getElementById("storeStructuredData");
  if(schema){const data=p?{"@context":"https://schema.org","@type":"Product","name":p.name,"description":desc,"image":(p.images||[]).map(x=>x.src).filter(Boolean),"brand":{"@type":"Brand","name":"TATTO✦OUI"},"offers":{"@type":"Offer","priceCurrency":"MAD","price":Number(p.price),"availability":Number(p.stock)>0?"https://schema.org/InStock":"https://schema.org/OutOfStock","url":base+"/#/product/"+p.id}}:{"@context":"https://schema.org","@type":"WebSite","name":"TATTO✦OUI","url":base+"/","description":desc};schema.textContent=JSON.stringify(data)}
}window.addEventListener("hashchange",()=>{resetTurnstile();render();updateSEO();if(location.hash==="#/checkout")setTimeout(renderTurnstile,120)});window.addEventListener("scroll",()=>{const b=document.getElementById("backtop");if(b)b.classList.toggle("show",scrollY>600)});render();syncStorefrontProductImages();updateSEO();setTimeout(renderTurnstile,500);
</script>
