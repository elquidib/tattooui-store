<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>TATTO✦OUI | فريق الطلبات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#171717;--muted:#777;--line:#e9e5de;--green:#147849;--red:#b42318;--amber:#946200}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif}button,input{font:inherit}button{border:0;border-radius:12px;padding:13px 15px;font-weight:800;cursor:pointer;min-height:46px}button:disabled{opacity:.5}.wrap{max-width:720px;margin:auto;padding:16px 13px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 16px}.brand{font-weight:950;letter-spacing:.08em;font-size:19px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 3px 14px #00000005}h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.primary{background:#111;color:#fff;width:100%;margin-top:15px}.soft{background:#eeeae3;color:#222}.error{color:var(--red);font-size:13px}.hidden{display:none!important}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;background:#ebe8e1;color:#333}.tab.active{background:#111;color:#fff}.toolbar{display:flex;gap:8px;align-items:center}.toolbar input{flex:1;min-width:0}.count{font-size:12px;color:var(--muted);white-space:nowrap}.orderhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.pill{background:#fff3d1;color:#795500;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.name{font-size:21px;font-weight:900;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info{background:#faf9f6;border:1px solid var(--line);border-radius:11px;padding:10px;min-width:0}.info small{display:block;color:var(--muted);font-size:11px}.info b{font-size:14px;overflow-wrap:anywhere}.wide{grid-column:1/-1}.items{border-top:1px solid var(--line);margin-top:13px;padding-top:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13px}.total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:12px;margin-top:6px;font-size:18px;font-weight:900}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.link{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:13px;font-weight:900;min-height:46px}.call{background:#eaf5ee;color:#176b42}.wa{background:#e9f7ee;color:#087443}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.confirm{background:#147849;color:#fff}.cancel{background:#fff0ee;color:#ad261d}.later{grid-column:1/-1;background:#fff4d7;color:#805600}.empty{text-align:center;color:var(--muted);padding:28px 10px}.note{background:#fff8e7;color:#775300;border-radius:11px;padding:11px;font-size:12px;line-height:1.6;margin-bottom:10px}@media(max-width:390px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.actions{grid-template-columns:1fr}.later{grid-column:auto}}
</style></head><body><div class="wrap">
<header class="top"><div><div class="brand">TATTO✦OUI</div><div class="muted">لوحة فريق تأكيد الطلبات</div></div><button id="logout" class="soft hidden">خروج</button></header>
<section id="login" class="card"><h1>مرحباً بك 🌸</h1><p class="muted">دخلي اسم المستخدم والرمز السري ديالك.</p><form id="loginForm"><label>اسم المستخدم</label><input id="username" autocomplete="username" required minlength="3"><label>PIN — ستة أرقام</label><input id="pin" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{6}" maxlength="6" required><button class="primary" id="loginBtn">دخول</button><p id="loginError" class="error" aria-live="polite"></p></form></section>
<main id="app" class="hidden"><section class="card"><div class="toolbar"><div style="flex:1"><b id="staffName">فريق الطلبات</b><div class="muted">اختاري الطلب وتواصلي مع الزبون</div></div><button id="refresh" class="soft">تحديث</button></div></section>
<div class="toolbar"><input id="search" placeholder="بحث برقم الطلب أو الاسم أو الهاتف..." aria-label="بحث"><span id="resultCount" class="count"></span></div>
<nav class="tabs" id="tabs"><button class="tab active" data-status="new">جديدة</button><button class="tab" data-status="confirmed">مؤكدة</button><button class="tab" data-status="shipped">خرجت للتوصيل</button><button class="tab" data-status="delivered">تم التسليم</button><button class="tab" data-status="cancelled">ملغاة</button><button class="tab" data-status="follow">اتصال لاحقاً</button></nav>
<div id="message" class="muted" aria-live="polite"></div><div id="orders"></div></main></div>
<script>
(()=>{const cfg=window.TATTOOUI_SUPABASE;if(!cfg||!window.supabase){document.getElementById('loginError').textContent='تعذر الاتصال بالخدمة.';return}const sb=window.supabase.createClient(cfg.url,cfg.publishableKey);const endpoint=cfg.url+'/functions/v1/staff-portal';const $=id=>document.getElementById(id);let token=localStorage.getItem('tattooui_staff_token')||'',orders=[],items=[],followups=[],staff=null,tab='new',busy=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('fr-MA',{maximumFractionDigits:2})+' DH';
async function api(action,data={},auth=token){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.publishableKey,...(auth?{Authorization:'Bearer '+auth}:{})},body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'تعذر تنفيذ العملية');return j}
function phone(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('00212'))d=d.slice(5);else if(d.startsWith('212'))d=d.slice(3);if(/^[67]\d{8}$/.test(d))d='0'+d;return /^0[67]\d{8}$/.test(d)?d:''}
function wa(o,type){const p=phone(o.phone);if(!p)return '#';const product=(items.filter(i=>i.order_id===o.id).map(i=>i.product_name+' × '+i.quantity).join('، '))||'الطلب ديالك';let msg='';if(type==='new')msg='سلام '+(o.customer_name||'')+'، معاك TATTO✦OUI.\n\nطلبك: '+product+'\nالثمن: '+money(o.total)+'\n\nواش نأكدو الطلب؟\n✅ نعم، تأكيد\n❌ إلغاء\n\nشكراً على ثقتك فينا!';else if(type==='confirmed')msg='طلبك تأكد بنجاح من TATTO✦OUI ❤️\n\nعافاك خلي تلفونك قريب منك، وردّ على اتصال الموزع باش توصلك الطلبية.\n\nشكراً على ثقتك فينا!';else msg='سلام '+(o.customer_name||'')+' ❤️\n\nطلبك من TATTO✦OUI خرج للتوصيل 🚚\n\nخلي تلفونك قريب منك وجاوبي على اتصال الموزع باش يستلمك الطلب.\n\nشكراً على ثقتك فينا 🌸';return 'https://wa.me/212'+p.slice(1)+'?text='+encodeURIComponent(msg)}
function render(){const q=$('search').value.trim().toLowerCase();let list=orders.filter(o=>(tab==='follow'?o.status==='new'&&followups.some(f=>f.order_id===o.id):o.status===tab)&&(!q||[o.order_number,o.customer_name,o.phone,o.city].join(' ').toLowerCase().includes(q)));$('resultCount').textContent=list.length+' طلب';$('orders').innerHTML=list.length?list.map(o=>{const oi=items.filter(i=>i.order_id===o.id),isNew=o.status==='new';const label={new:'طلب جديد',confirmed:'تم التأكيد',shipped:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغى'}[o.status]||o.status;return '<article class="card"><div class="orderhead"><b class="muted">طلب #'+esc(o.order_number)+'</b><span class="pill">'+label+'</span></div><div class="name">'+esc(o.customer_name)+'</div><div class="grid"><div class="info"><small>الهاتف</small><b dir="ltr">'+esc(phone(o.phone)||o.phone||'—')+'</b></div><div class="info"><small>المدينة</small><b>'+esc(o.city||'—')+'</b></div><div class="info wide"><small>العنوان</small><b>'+esc(o.address||'—')+'</b></div>'+(o.notes?'<div class="info wide"><small>ملاحظات</small><b>'+esc(o.notes)+'</b></div>':'')+'</div><div class="items">'+(oi.map(i=>'<div class="item"><span>'+esc(i.product_name)+' × '+esc(i.quantity)+'</span><b>'+money(i.line_total)+'</b></div>').join('')||'<span class="muted">تفاصيل المنتجات غير متوفرة</span>')+'</div><div class="total"><span>المجموع</span><span>'+money(o.total)+'</span></div><div class="links"><a class="link call" href="tel:'+esc(phone(o.phone))+'">☎ اتصال</a><a class="link wa" target="_blank" rel="noopener" href="'+esc(wa(o,o.status==='new'?'new':o.status==='confirmed'?'confirmed':'shipped'))+'">WhatsApp · مراجعة وإرسال</a></div>'+(isNew?'<div class="actions"><button class="confirm" data-action="confirmed" data-id="'+o.id+'">✓ تأكيد</button><button class="cancel" data-action="cancelled" data-id="'+o.id+'">إلغاء</button><button class="later" data-action="later" data-id="'+o.id+'">اتصال لاحقاً</button></div>':'')+'</article>'}).join(''):'<section class="card empty">ما كاين حتى طلب فهاد اللائحة حالياً.</section>'}
async function load(){ $('message').textContent='جاري تحديث الطلبات…';try{const d=await api('list_orders');orders=d.orders||[];items=d.items||[];followups=d.followups||[];staff=d.staff;$('staffName').textContent=staff.display_name;render();$('message').textContent='آخر تحديث: '+new Date().toLocaleTimeString('fr-MA')}catch(e){if(/انتهت الجلسة/.test(e.message)){logout();return}$('message').textContent=e.message}}
async function enter(){try{const d=await api('list_orders');orders=d.orders||[];items=d.items||[];followups=d.followups||[];staff=d.staff;$('staffName').textContent=staff.display_name;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render();$('message').textContent='تم تسجيل الدخول بنجاح'}catch(e){localStorage.removeItem('tattooui_staff_token');token='';$('loginError').textContent=e.message}}
function logout(){if(token)api('logout').catch(()=>{});token='';localStorage.removeItem('tattooui_staff_token');$('app').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginError').textContent='';try{const d=await api('login',{username:$('username').value,pin:$('pin').value},'');token=d.token;localStorage.setItem('tattooui_staff_token',token);$('pin').value='';await enter()}catch(err){$('loginError').textContent=err.message}finally{$('loginBtn').disabled=false}});
$('logout').addEventListener('click',logout);$('refresh').addEventListener('click',load);$('search').addEventListener('input',render);$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-status]');if(!b)return;tab=b.dataset.status;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
$('orders').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const action=b.dataset.action,id=b.dataset.id;const prompt=action==='later'?'نضيفو هاد الطلب للاتصال لاحقاً؟':action==='confirmed'?'نأكدو هاد الطلب؟':'نلغيو هاد الطلب؟';if(!confirm(prompt))return;const waTab=action==='confirmed'?window.open('about:blank','_blank'):null;busy=true;b.disabled=true;try{await api(action==='later'?'mark_call_later':'set_status',{order_id:id,...(action==='later'?{}:{status:action})});const confirmedOrder=orders.find(o=>String(o.id)===String(id));await load();if(action==='confirmed'&&waTab){const freshOrder=orders.find(o=>String(o.id)===String(id))||confirmedOrder;const waUrl=freshOrder?wa(freshOrder,'confirmed'):'#';if(waUrl!=='#')waTab.location.href=waUrl;else waTab.close()}$('message').textContent=action==='confirmed'?'تأكد الطلب، ورسالة التأكيد واجدة فـ WhatsApp.':'تم حفظ التغيير.'}catch(err){if(waTab)waTab.close();$('message').textContent=err.message}finally{busy=false}});
if(token)enter();
})();
</script></body></html>
