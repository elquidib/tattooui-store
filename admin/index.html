<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TATTOOUI Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><style>body{margin:0;background:#f5f3ee;color:#111;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:30px}.card{background:white;border:1px solid #ddd8cf;border-radius:16px;padding:24px;margin:15px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd8cf;border-radius:9px;margin:6px 0 14px}button{padding:11px 16px;border:0;border-radius:9px;background:#111;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;background:#fff;border:1px solid #ddd8cf;border-radius:12px}.muted{color:#777}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div id="login" class="wrap"><div class="card"><h1>TATTOOUI</h1><p class="muted">Admin dashboard</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Sign in</button><p id="error"></p></form></div></div><div id="app" class="wrap hidden"><div class="card"><h1>TATTOOUI Admin</h1><button onclick="logout()">Log out</button></div><div class="grid"><div class="stat">Products<h2 id="products">—</h2></div><div class="stat">Orders<h2 id="orders">—</h2></div><div class="stat">Reviews<h2 id="reviews">—</h2></div></div><div class="card"><h2>Products</h2><p class="muted">The full product editor is the next module. The connection to your live database is already working.</p><button onclick="loadStats()">Refresh</button></div></div><script>const db=supabase.createClient(TATTOOUI_SUPABASE.url,TATTOOUI_SUPABASE.publishableKey);async function isAdmin(){const u=await db.auth.getUser();if(!u.data.user)return false;const r=await db.from("profiles").select("role").eq("id",u.data.user.id).maybeSingle();return r.data?.role==="admin"}async function loadStats(){const a=await Promise.all(["products","orders","reviews"].map(t=>db.from(t).select("*",{count:"exact",head:true})));document.getElementById("products").textContent=a[0].count??0;document.getElementById("orders").textContent=a[1].count??0;document.getElementById("reviews").textContent=a[2].count??0}async function start(){if(await isAdmin()){login.classList.add("hidden");app.classList.remove("hidden");loadStats()}}loginForm.onsubmit=async e=>{e.preventDefault();error.textContent="";const r=await db.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){error.textContent=r.error.message;return}if(!(await isAdmin())){await db.auth.signOut();error.textContent="This account is not an admin.";return}start()};async function logout(){await db.auth.signOut();location.reload()}start();</script></body></html>
